# MODELO - NAO aplique este arquivo diretamente (o valor abaixo e so um marcador).
#
# Forma recomendada (nao grava o segredo em disco):
#
#   kubectl create secret generic biblioteca-secret \
#     --from-literal=jwt-secret="$(openssl rand -base64 32)"
#
# No Windows PowerShell (sem openssl):
#
#   $b = [byte[]]::new(32); [Security.Cryptography.RandomNumberGenerator]::Fill($b)
#   kubectl create secret generic biblioteca-secret --from-literal=jwt-secret=$([Convert]::ToBase64String($b))
#
# Alternativa por arquivo: copie para  k8s/base/secret.yaml  (ja ignorado pelo
# Git), substitua o valor e rode:  kubectl apply -f k8s/base/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: biblioteca-secret
type: Opaque
stringData:
  # A aplicacao le a propriedade api.security.token.secret; o Deployment injeta
  # este valor na variavel de ambiente API_SECURITY_TOKEN_SECRET.
  jwt-secret: "SUBSTITUIR-POR-SEGREDO-COM-PELO-MENOS-256-BITS"
